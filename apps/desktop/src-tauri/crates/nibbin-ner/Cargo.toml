[package]
name = "nibbin-ner"
description = "HTTP client for the supervised Presidio NER sidecar (loopback only). Kept OUT of nibbin-redaction so the capture closure (nibbin-capture → nibbin-redaction) is provably network-free — C1 'by construction'. Only observerd links this."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nibbin-redaction = { path = "../nibbin-redaction" }
serde_json = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
