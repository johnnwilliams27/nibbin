[package]
name = "nibbin-capture"
description = "Capture trait + platform sources (macOS AX first, Windows UIA behind the same trait — SPEC §5/§8 M6). Event-driven, AX-first, pixels-second. The capture module has NO network dependency, by construction (C1): this crate must never grow a network import."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Platform bring-up wires the vendored Screenpipe a11y fork (vendor/screenpipe,
# MIT commit 892199f742) behind this flag during macOS hardware bring-up.
# On Windows it also pulls in the `windows` crate (gated to the windows target
# below) so WindowsUiaCapture can drive per-tick UIA tree snapshots.
screenpipe = ["dep:screenpipe-a11y", "dep:serde_json"]

[dependencies]
nibbin-redaction = { path = "../nibbin-redaction" }
anyhow = { workspace = true }
screenpipe-a11y = { path = "../../../../../vendor/screenpipe/crates/screenpipe-a11y", optional = true }
# H1 tree-hash dedup serializes the AccessibilityNode tree to fingerprint it.
# Only needed by the screenpipe Windows adapter; gated to that feature.
serde_json = { workspace = true, optional = true }

# Windows UIA adapter (real capture) needs GetForegroundWindow + COM init.
# Always-on (NOT feature-gated): `set_low_process_priority` (H3/P-CB6) calls
# SetPriorityClass on the DEFAULT Windows build (observerd invokes it there),
# so the `windows` crate must be present without the `screenpipe` feature. The
# heavier UIA/COM/hook code that uses the other features stays `#[cfg(feature =
# "screenpipe")]`. Pin to 0.58 to match the vendored fork so the HWND/HRESULT
# types are identical.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
