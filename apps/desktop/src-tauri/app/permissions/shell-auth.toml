# Shell-window permissions — commands invoked by the native main-window UI only.
#
# SECURITY MODEL
# ──────────────
# These permissions target the LOCAL TRUSTED SHELL (the `main` webview, which
# loads from the app bundle — `localhost` / `asset://` origin). They are NOT
# granted to the `grove` webview (remote nibbin.com content). Granting these to
# the remote webview would bypass the keychain session boundary; do not add any
# of these identifiers to grove-remote.json.
#
# Each permission targets a SINGLE command; no wildcard grants exist.
# Add a new identifier here first, then reference it in
# capabilities/default.json's `permissions` array.

# ── Session / auth commands ───────────────────────────────────────────────────
# Invoked by the native login flow (apps/desktop/src/ui/views/login.ts) and the
# account/sign-out UI. The `main` window is the trusted desktop shell; granting
# keychain read/write here is correct and intentional. The grove webview must
# never receive these — the session handoff goes through an init script, not IPC.

[[permission]]
identifier = "allow-store-session"
description = "Enables the store_session command. Persists a Supabase session (minimized to fit the Windows Credential Manager 2560-char blob limit) to the OS keychain. Invoked by the native login gate (main webview) after a successful email/password sign-in. NOT granted to the grove (remote) webview."
commands.allow = ["store_session"]

[[permission]]
identifier = "allow-auth-session"
description = "Enables the auth_session command. Reads and silently refreshes the stored Supabase session from the OS keychain. Used by the native shell to check sign-in state on boot. NOT granted to the grove (remote) webview."
commands.allow = ["auth_session"]

[[permission]]
identifier = "allow-sign-out"
description = "Enables the sign_out command. Deletes the stored Supabase session credential from the OS keychain. Invoked by the native sign-out UI and the Grove-webview /login redirect handler (which calls auth::sign_out() directly in Rust — not via IPC). NOT granted to the grove (remote) webview."
commands.allow = ["sign_out"]

# ── Grove webview management commands ─────────────────────────────────────────
# The Grove child webview is created and managed by the native shell (main
# window). These IPC commands let the shell JS show/hide/reload the child.

[[permission]]
identifier = "allow-grove-show"
description = "Enables the grove_show command. Creates (on first call) or shows the embedded Grove child webview. Invoked by the main-window shell to switch to the Grove tab. NOT granted to the grove (remote) webview."
commands.allow = ["grove_show"]

[[permission]]
identifier = "allow-grove-hide"
description = "Enables the grove_hide command. Hides the embedded Grove child webview. Invoked by the main-window shell when switching away from the Grove tab or signing out. NOT granted to the grove (remote) webview."
commands.allow = ["grove_hide"]

[[permission]]
identifier = "allow-grove-reload"
description = "Enables the grove_reload command. Reloads the embedded Grove child webview in-place (Retry after network failure). Invoked by the main-window shell. NOT granted to the grove (remote) webview."
commands.allow = ["grove_reload"]

# ── Update / navigation commands ──────────────────────────────────────────────
# Best-effort version check and safe browser opener. Both validate inputs in
# Rust before acting; open_external enforces an https + allowlist check.

[[permission]]
identifier = "allow-check-for-update"
description = "Enables the check_for_update command. Queries the GitHub releases API (from Rust, CSP-safe) and returns whether a newer installer is available. Read-only; no side effects. NOT granted to the grove (remote) webview."
commands.allow = ["check_for_update"]

[[permission]]
identifier = "allow-open-external"
description = "Enables the open_external command. Opens a URL in the system browser via the opener plugin. The command validates that the URL is https + one of {nibbin.com, www.nibbin.com, github.com} before passing it to the OS — confused-deputy mitigation. NOT granted to the grove (remote) webview."
commands.allow = ["open_external"]
