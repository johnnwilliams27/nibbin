# The Observer's Rust workspace.
#
# `default-members` deliberately excludes `app` (the Tauri shell): the shell
# needs platform webview toolchains (macOS/Windows), while the privacy-core
# crates and the observerd daemon are platform-neutral and are built + tested
# in CI on Linux. `cargo test` therefore exercises redaction/store/study/
# capture(mock) + observerd everywhere; the app crate builds in the platform
# release pipeline.
[workspace]
resolver = "2"
members = [
    "crates/nibbin-redaction",
    "crates/nibbin-store",
    "crates/nibbin-study",
    "crates/nibbin-capture",
    "observerd",
    "app",
]
default-members = [
    "crates/nibbin-redaction",
    "crates/nibbin-store",
    "crates/nibbin-study",
    "crates/nibbin-capture",
    "observerd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
anyhow = "1"
