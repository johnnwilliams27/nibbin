[package]
name = "observerd"
description = "The Observer capture daemon. Owns capture → redaction → SQLCipher persistence and the study lifecycle; enforces the day-14 hard stop (C2) with no UI in the process. Ships as a LaunchAgent (macOS) / service (Windows); the Tauri app is only a client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
os-keystore = ["nibbin-store/os-keystore"]

[dependencies]
nibbin-redaction = { path = "../crates/nibbin-redaction" }
nibbin-ner = { path = "../crates/nibbin-ner" }
nibbin-store = { path = "../crates/nibbin-store" }
nibbin-study = { path = "../crates/nibbin-study" }
nibbin-capture = { path = "../crates/nibbin-capture" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[dev-dependencies]
tempfile = "3"
