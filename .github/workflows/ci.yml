name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gates:
    name: Typecheck, lint, tests, redaction corpus, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pinned by digest (postgres:17-alpine @ 2026-06-10) — no floating images
        # in CI (red-team M0 finding). RLS attack suite runs against this.
        image: postgres@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RLS_DATABASE_URL: postgres://postgres:postgres@localhost:54329/postgres
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: tests (includes redaction corpus — CI-blocking, P0)
        run: npm test
      - run: npm run build
      - name: trigger-graph-validation
        run: echo "wire at M4 - cycle-check suite (agent runtime does not exist yet)"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit

  desktop-rust:
    name: Observer daemon (fmt, clippy, cargo test incl. Rust corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (runs the same redaction-corpus fixtures as vitest)
        run: cargo test

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # pinned by digest (semgrep/semgrep:latest @ 2026-06-10) — the SAST job
      # must not itself run a floating, mutable image (red-team M0 finding).
      image: semgrep/semgrep@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # vendor/ is frozen third-party source (Screenpipe fork at its last MIT
      # commit, see vendor/screenpipe/VENDOR.md) — audited at vendor time, not
      # eligible for in-PR SAST noise; our wrapping code IS scanned.
      - run: semgrep scan --config p/default --error --exclude reference --exclude vendor --exclude tools/grovemap/grovemap.html

  grovemap:
    name: Grovemap artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: node tools/grovemap/grovemap.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grovemap
          path: |
            tools/grovemap/grovemap.html
            tools/grovemap/graph.json
