name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gates:
    name: Typecheck, lint, tests, redaction corpus, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pinned by digest (pgvector/pgvector:pg17 @ 2026-06-18) — no floating
        # images in CI (red-team M0 finding). RLS attack suite runs against this.
        # pgvector image (Postgres 17 + the `vector` extension) because the
        # agent-memory migration declares an `embedding vector(1024)` column and
        # an HNSW index; stock postgres:17 has no pgvector and the migration —
        # applied verbatim by the RLS harness — would fail to create the extension.
        image: pgvector/pgvector@sha256:be400b50812ab2cc908ed78593fda2e51e3b45fe774fa637f1c7b16e68531d95
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RLS_DATABASE_URL: postgres://postgres:postgres@localhost:54329/postgres
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: tests (includes redaction corpus — CI-blocking, P0)
        run: npm test
      - run: npm run build
      - name: trigger-graph-validation
        # §7.3 cycle-check suite + §7.2 trust gates as an explicit named gate
        # (they also run inside `npm test` above — this step makes a
        # regression unmissable in the required-checks list)
        run: npx vitest run packages/runtime/test/trigger-graph.test.ts packages/runtime/test/trust-gate.test.ts
      - name: synthesis-quality-eval
        # P5 T10 gating check: citation precision ≥0.90, gap recall ≥0.80,
        # hallucination rate =0.00. Runs after the full test suite so the DB
        # (already seeded by the RLS suites) is available. Exits 1 on threshold
        # miss — this step MUST remain in the required-checks list.
        run: npm run eval:synthesis

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit

  computer-use-live:
    # The REAL-Chromium proof of the #165 egress fix: the gated live suite
    # (apps/web/lib/planner/browser.live.test.ts) drives the actual
    # PlaywrightBrowserDriver against a launched Chromium to prove the
    # context.route('**') fetch-and-fulfill interceptor fires, a private/loopback
    # target is blocked, and a public navigation is fulfilled from PINNED bytes +
    # quarantined. This is a DEDICATED, ISOLATED job (separate from `gates` so the
    # default install stays lean and a Chromium hiccup can't block unrelated work)
    # — but it DOES gate this branch. The suite self-skips cleanly if the browser
    # is absent (triple gate in the test), so it can never FALSE-fail; here we
    # install Chromium so it actually runs.
    name: computer_use live browser (real Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      # Full install (incl. the `playwright` devDep). Skip the browser download in
      # npm's postinstall — we install Chromium explicitly below with its OS deps.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Install ONLY chromium + its Linux system libraries (the live test launches
      # the full `playwright` bundled chromium on CI, mirroring local dev).
      - name: Install Chromium for the live test
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Live fetch-and-fulfill suite (real Chromium)
        run: npx vitest run apps/web/lib/planner/browser.live.test.ts
        env:
          COMPUTER_USE_LIVE_TEST: "1"

  desktop-rust:
    name: Observer daemon (fmt, clippy, cargo test incl. Rust corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (runs the same redaction-corpus fixtures as vitest)
        run: cargo test

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # pinned by digest (semgrep/semgrep:latest @ 2026-06-10) — the SAST job
      # must not itself run a floating, mutable image (red-team M0 finding).
      image: semgrep/semgrep@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # vendor/ is frozen third-party source (Screenpipe fork at its last MIT
      # commit, see vendor/screenpipe/VENDOR.md) — audited at vendor time, not
      # eligible for in-PR SAST noise; our wrapping code IS scanned.
      - run: semgrep scan --config p/default --error --exclude reference --exclude vendor --exclude tools/grovemap/grovemap.html

  grovemap:
    name: Grovemap artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: node tools/grovemap/grovemap.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grovemap
          path: |
            tools/grovemap/grovemap.html
            tools/grovemap/graph.json

  desktop-app:
    # The Tauri shell crate (`app`) is a workspace member EXCLUDED from
    # default-members (it needs the platform webview toolchain), so the
    # desktop-rust job's `cargo clippy`/`cargo test` skip it. That gap let two
    # compile errors (E0282, then E0308) reach a release build before this job
    # existed — the app crate only compiled at `tauri build` time. This job
    # cargo-checks it on every PR so those are caught pre-merge.
    name: Desktop app crate (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-06-15
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: linux-desktop-app-${{ hashFiles('apps/desktop/src-tauri/**/Cargo.lock') }}
      # tauri-build reads bundle.resources (["binaries/observerd*"]); stage an
      # empty placeholder so the glob resolves during the build script. We don't
      # bundle here — this is a type-check only, not a release build.
      - name: Stage placeholder daemon (satisfies bundle.resources glob)
        run: |
          mkdir -p apps/desktop/src-tauri/app/binaries
          touch apps/desktop/src-tauri/app/binaries/observerd
      - name: cargo check the Tauri app crate
        working-directory: apps/desktop/src-tauri
        run: cargo check -p nibbin-observer-app
