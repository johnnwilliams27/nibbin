name: desktop-release

# Builds the Nibbin Observer installers (macOS .dmg + Windows .msi) and
# publishes them to the PUBLIC repo johnnwilliams27/nibbin-desktop, where trial
# users can download them anonymously (this source repo is private).
#
# Signing is CONDITIONAL on both platforms: when the signing secrets exist the
# artifacts are signed (+ notarized on macOS); until then it produces working
# UNSIGNED installers that download fine but warn (Gatekeeper / SmartScreen) on
# first launch. Adding the secrets later flips signing on with no code change.
#
# Required secrets (in this repo's settings):
#   RELEASES_REPO_TOKEN  – fine-grained PAT with Contents:write on nibbin-desktop
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID  – macOS signing/notarization
# Windows signing via Azure Trusted Signing (all six required together; absent →
# unsigned .msi):
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET  – Entra service
#     principal with the "Artifact Signing Certificate Profile Signer" role
#     (Azure renamed Trusted Signing → Artifact Signing; endpoint + provider
#     Microsoft.CodeSigning unchanged, so trusted-signing-cli still works)
#   AZURE_CODESIGN_ENDPOINT  – the account URI, e.g. https://wus2.codesigning.azure.net
#   AZURE_CODESIGN_ACCOUNT   – Trusted Signing account name
#   AZURE_CODESIGN_PROFILE   – certificate profile name
# Signing keys on the presence of AZURE_CLIENT_ID; when set, the Windows job
# installs trusted-signing-cli and generates a --config patch adding
# bundle.windows.signCommand at build time (the real tauri.conf.json is never
# mutated, so unsigned builds stay reproducible).
#
# Trigger: push a tag `desktop-v*`, or run manually (workflow_dispatch).
#
# NOTE (first cut — expect CI iteration): the Tauri shell lives in the nested
# layout apps/desktop/src-tauri/app (a Cargo workspace with the Tauri binary in
# the `app` member). The CLI discovers the nested tauri.conf.json correctly
# (verified via `tauri info`); artifact paths still want a sanity pass after the
# first real bundle.

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

env:
  RELEASES_REPO: johnnwilliams27/nibbin-desktop

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            rust-targets: ''
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-06-15
        with:
          # When pinned by SHA the action can't infer the channel from the ref, so name it.
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('apps/desktop/src-tauri/**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      # Resolve the per-platform `tauri build` args, and — on Windows only —
      # decide whether to sign. Signing keys on AZURE_CLIENT_ID being present:
      # when it is, we write a throwaway --config patch that adds
      # bundle.windows.signCommand (so the committed tauri.conf.json is never
      # mutated and unsigned builds stay byte-reproducible). Runs in bash, which
      # GitHub's windows-latest images ship (Git Bash).
      - name: Resolve build args + Windows signing
        id: cfg
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CODESIGN_ENDPOINT: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
          AZURE_CODESIGN_ACCOUNT: ${{ secrets.AZURE_CODESIGN_ACCOUNT }}
          AZURE_CODESIGN_PROFILE: ${{ secrets.AZURE_CODESIGN_PROFILE }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            echo "args=--target universal-apple-darwin" >> "$GITHUB_OUTPUT"
          elif [ -n "${AZURE_CLIENT_ID:-}" ]; then
            # Endpoint / account / profile carry no spaces, so the signCommand
            # tokenizes cleanly (Tauri splits it on whitespace; %1 = the file).
            patch="apps/desktop/src-tauri/app/tauri.signing.windows.json"
            printf '{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e %s -a %s -c %s %%1"}}}\n' \
              "$AZURE_CODESIGN_ENDPOINT" "$AZURE_CODESIGN_ACCOUNT" "$AZURE_CODESIGN_PROFILE" > "$patch"
            echo "generated signing patch:"; cat "$patch"
            # --config path is resolved relative to projectPath (apps/desktop).
            echo "args=--config src-tauri/app/tauri.signing.windows.json" >> "$GITHUB_OUTPUT"
            echo "sign_windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "Windows: AZURE_CLIENT_ID not set — building UNSIGNED .msi" >&2
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install trusted-signing-cli (Windows, only when signing)
        if: steps.cfg.outputs.sign_windows == 'true'
        run: cargo install trusted-signing-cli --version 0.11.0 --locked

      - name: Build installers (tauri-action, build only)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0 (action-v0.6.2)
        env:
          # macOS signing + notarization (no-ops until the secrets are set)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: trusted-signing-cli authenticates via DefaultAzureCredential,
          # which reads these. Empty when unconfigured → signCommand never runs.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Stage C: activate the Grove session handoff. Read at Rust compile time via
          # option_env!("NIBBIN_GROVE_HANDOFF") — when set, the embedded Grove webview
          # receives the keychain session (injected, never in a URL) and consumes it at
          # /desktop-auth (live on prod once this branch ships). web_url() defaults to
          # https://nibbin.com so no NIBBIN_WEB_URL override is needed for prod builds.
          NIBBIN_GROVE_HANDOFF: "1"
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          # No tagName → tauri-action builds the bundles but does NOT create a
          # release here (publishing happens cross-repo in the publish job).
          args: ${{ steps.cfg.outputs.args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe

  publish:
    name: publish-release
    needs: build
    # Ship whatever built. `needs: build` defaults to "all legs succeeded", which
    # would let one platform's failure (e.g. a bad signing cert) bury a perfectly
    # good installer from the other. !cancelled() runs publish on partial success;
    # download-artifact only pulls the legs that uploaded, and the steps below
    # already key off whichever .dmg/.msi are actually present.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # required for signed build-provenance attestation (supply-chain integrity)
      id-token: write
      attestations: write
    steps:
      # Checkout FIRST (before download-artifact) — the publish step derives the
      # release version from apps/desktop/src-tauri/app/tauri.conf.json via jq, so
      # the repo must be present. (checkout cleans the workspace, so it has to run
      # before the artifacts land in dist/.)
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          ( cd dist && find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0 \
              | xargs -0 sha256sum | sed 's# \./# #' > SHA256SUMS.txt )
          echo "--- SHA256SUMS.txt ---"; cat dist/SHA256SUMS.txt

      - name: Attest build provenance
        # Supply-chain nice-to-have, not a release gate: if it trips on a partial
        # artifact set (e.g. only .msi present, the .dmg glob empty), publish the
        # installers anyway rather than burying a working download.
        #
        # Skipped on private repos: build-provenance attestation is unavailable for
        # user-owned private repositories and otherwise logs a (non-fatal) red error
        # on every release. Re-enables automatically if the repo is made public.
        if: ${{ !github.event.repository.private }}
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe

      - name: Publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          # github context passed via env (never interpolated into the script) —
          # ref names are attacker-controllable; semgrep run-shell-injection.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Version is the single source of truth in tauri.conf.json — BUMP IT
          # PER RELEASE (the desktop update check reads the same field via
          # app.package_info().version, so a stale value here would mislead it).
          # Tag-push builds honor the pushed tag; manual (dispatch) builds derive
          # `desktop-v<version>-<run#>` from that file rather than a hardcode.
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            VERSION=$(jq -r .version apps/desktop/src-tauri/app/tauri.conf.json)
            TAG="desktop-v${VERSION}-${RUN_NUMBER}"
          fi
          mapfile -t FILES < <(find dist -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \))
          if [ ${#FILES[@]} -eq 0 ]; then echo "no installers found in dist/"; exit 1; fi
          echo "Publishing ${FILES[*]} to $RELEASES_REPO @ $TAG"
          gh release create "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "Nibbin Observer $TAG" \
            --notes "macOS .dmg (universal — Apple Silicon + Intel) and Windows .msi + .exe, code-signed (macOS notarized; Windows via Azure Trusted Signing). Verify integrity with SHA256SUMS.txt. Windows SmartScreen may still prompt on first launch until the app accrues download reputation." \
            --prerelease \
            "${FILES[@]}" \
            dist/SHA256SUMS.txt
